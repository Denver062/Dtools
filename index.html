<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dtools — 브라우저에서 끝나는 파일 도구</title>
    <meta
      name="description"
      content="압축, 압축 풀기, PDF 합치기·분할·압축, 파일 변환까지. 파일이 서버로 전송되지 않는 100% 로컬 파일 도구."
    />
    <meta name="theme-color" content="#0e1119" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%238ab2ef'/%3E%3Cpath d='M9 8h6.4a8 8 0 0 1 0 16H9z' fill='%230c182c'/%3E%3Cpath d='M13 12.2h2.4a3.8 3.8 0 0 1 0 7.6H13z' fill='%238ab2ef'/%3E%3C/svg%3E"
    />
    <script>
      try {
        var t = localStorage.getItem('dtools-theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
